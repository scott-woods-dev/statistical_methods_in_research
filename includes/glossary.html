<script>
(function () {
  'use strict';

  function ready(callback) {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', callback, { once: true });
    } else {
      callback();
    }
  }

  ready(function () {
    initTooltips();
    initGlossaryPage();
  });

  function initTooltips() {
    var links = document.querySelectorAll('a.glossary-link[data-definition]');
    if (!links.length) {
      return;
    }

    var tooltip = document.getElementById('glossary-tooltip');
    if (!tooltip) {
      tooltip = document.createElement('div');
      tooltip.id = 'glossary-tooltip';
      tooltip.className = 'glossary-tooltip';
      tooltip.setAttribute('role', 'tooltip');
      tooltip.hidden = true;
    }
    if (tooltip.parentElement !== document.body) {
      document.body.appendChild(tooltip);
    }

    var current = null;
    var hideTimer = null;

    function clearHideTimer() {
      if (hideTimer !== null) {
        window.clearTimeout(hideTimer);
        hideTimer = null;
      }
    }

    function position(link) {
      var rect = link.getBoundingClientRect();
      if (rect.bottom < 0 || rect.top > window.innerHeight) {
        hide();
        return;
      }

      var gap = 8;
      var pad = 8;
      tooltip.style.left = '0px';
      tooltip.style.top = '0px';

      var box = tooltip.getBoundingClientRect();
      var left = rect.left + (rect.width / 2) - (box.width / 2);
      left = Math.max(pad, Math.min(left, window.innerWidth - box.width - pad));

      var top = rect.bottom + gap;
      if (top + box.height > window.innerHeight - pad) {
        top = rect.top - box.height - gap;
      }
      if (top < pad) {
        top = pad;
      }

      tooltip.style.left = left + 'px';
      tooltip.style.top = top + 'px';
    }

    function show(link) {
      clearHideTimer();
      current = link;
      tooltip.textContent = link.getAttribute('data-definition') || '';
      tooltip.hidden = false;
      link.setAttribute('aria-describedby', 'glossary-tooltip');
      position(link);
    }

    function hide() {
      clearHideTimer();
      if (current) {
        current.removeAttribute('aria-describedby');
      }
      current = null;
      tooltip.hidden = true;
      tooltip.textContent = '';
    }

    function scheduleHide() {
      clearHideTimer();
      hideTimer = window.setTimeout(hide, 180);
    }

    Array.prototype.forEach.call(links, function (link) {
      link.addEventListener('mouseenter', function () {
        show(link);
      });
      link.addEventListener('mouseleave', scheduleHide);
      link.addEventListener('focus', function () {
        show(link);
      });
      link.addEventListener('blur', hide);
      link.addEventListener('click', hide);
      link.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') {
          hide();
        }
      });
    });

    tooltip.addEventListener('mouseenter', clearHideTimer);
    tooltip.addEventListener('mouseleave', scheduleHide);

    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape' && !tooltip.hidden) {
        hide();
      }
    });

    window.addEventListener('scroll', function () {
      if (current && !tooltip.hidden) {
        position(current);
      }
    }, { passive: true });

    window.addEventListener('resize', function () {
      if (current && !tooltip.hidden) {
        position(current);
      }
    });
  }

  function initGlossaryPage() {
    var table = document.getElementById('glossary-table');
    var input = document.getElementById('glossary-search');
    var clear = document.getElementById('glossary-clear');
    var status = document.getElementById('glossary-status');
    var panel = document.getElementById('glossary-filter');

    if (table && input && clear && status && panel) {
      initFilter(table, input, clear, status, panel);
    }

    highlightTarget();
    window.addEventListener('hashchange', highlightTarget);
  }

  function initFilter(table, input, clear, status, panel) {
    var rows = Array.prototype.slice.call(table.querySelectorAll('tbody tr'));
    var total = rows.length;
    if (!total) {
      return;
    }

    panel.hidden = false;

    function normalize(value) {
      value = value.toLowerCase();
      if (value.normalize) {
        value = value.normalize('NFD').replace(/[̀-ͯ]/g, '');
      }
      return value;
    }

    function apply() {
      var query = normalize(input.value.trim());
      var shown = 0;

      rows.forEach(function (row) {
        var match = !query || normalize(row.textContent).indexOf(query) !== -1;
        row.hidden = !match;
        if (match) {
          shown += 1;
        }
      });

      clear.hidden = query === '';
      if (query === '') {
        status.textContent = 'Showing all ' + total + ' terms.';
      } else {
        status.textContent = 'Showing ' + shown + ' of ' + total + ' terms for "' + input.value.trim() + '".';
      }
    }

    input.addEventListener('input', apply);
    input.addEventListener('keydown', function (event) {
      if (event.key === 'Escape') {
        input.value = '';
        apply();
      }
    });

    clear.addEventListener('click', function () {
      input.value = '';
      apply();
      input.focus();
    });

    Array.prototype.forEach.call(document.querySelectorAll('.glossary-az a'), function (link) {
      link.addEventListener('click', function () {
        if (input.value !== '') {
          input.value = '';
          apply();
        }
      });
    });

    apply();
  }

  function highlightTarget() {
    var identifier = window.location.hash.slice(1);
    if (!identifier) {
      return;
    }

    var anchor = document.getElementById(identifier);
    if (!anchor || !anchor.closest) {
      return;
    }

    var row = anchor.closest('tr');
    if (!row) {
      return;
    }

    row.classList.add('glossary-target');
    window.setTimeout(function () {
      row.classList.remove('glossary-target');
    }, 2500);
  }
})();
</script>
