on:
  push:
    branches: [main]

name: Render and Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # R runs the dataset ZIP step after the book render and every code chunk
      # in the companion. Public RSPM serves prebuilt Linux packages.
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install the companion's R packages
        run: |
          install.packages(c("knitr", "rmarkdown", "ggplot2", "psych", "car",
                             "effectsize", "emmeans", "pROC", "forecast",
                             "DescTools"))
        shell: Rscript {0}

      - name: Render book (HTML only; PDF built locally until beta)
        run: quarto render --to html

      # Must follow the book render, which clears docs/; the companion's
      # post-render step copies its HTML into docs/companion/.
      - name: Render R companion (HTML only; PDF built locally until beta)
        run: quarto render --to html
        working-directory: r_companion

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
