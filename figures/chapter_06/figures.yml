figures:
- id: '6.1'
  file: fig_06_01_hist_residuals_histogram_concept.png
  type: hist
  caption: Distribution of the pooled residuals from the one-way ANOVA of writing
    scores by program track. The residuals are centered at zero and roughly bell-shaped,
    with a mild left tail. The smooth curve marks a normal distribution with the same
    mean and standard deviation.
  alt: Histogram of the pooled ANOVA residuals, centered near zero with a roughly
    bell-shaped distribution and a mild left tail. A smooth normal curve is overlaid,
    and a dashed vertical line marks zero.
  width_in: 6.5
  height_in: 4.25
  dpi: 300.0
  script: r_code/figures/chapter_06.R
  author_note: This is the actual residual distribution from aov(write ~ prog), not
    a generic illustration. The mild left tail comes from the 31-point writing score
    in the academic track.
  colour_audit:
    n_colours: 3
    min_contrast: 2.3074822
    min_lab_distance: 70.8574031
- id: '6.2'
  file: fig_06_02_scatter_qq_diagnostic_examples.png
  type: scatter
  caption: Simulated normal probability plots for three residual patterns. In the
    normal panel, points follow the dashed line. In the skewed panel, the points hook
    away at the upper end. In the heavy-tails panel, the points form an S-curve across
    the line.
  alt: Three side-by-side normal probability plots with a dashed diagonal line. The
    normal panel shows points hugging the line. The skewed panel shows points curving
    upward at the top. The heavy-tails panel shows points below the line at the low
    end and above it at the high end, forming an S-shape.
  width_in: 6.5
  height_in: 3.4
  dpi: 300.0
  script: r_code/figures/chapter_06.R
  author_note: Simulated residuals, not the hsb.csv data. Normal uses rnorm, skewed
    uses rexp, and heavy tails uses rt with 3 degrees of freedom.
  colour_audit:
    n_colours: 2
    min_contrast: 5.1854463
    min_lab_distance: 55.3717028
- id: '6.3'
  file: fig_06_03_scatter_writing_jitter_equal_variances.png
  type: scatter
  caption: Jitter plot of writing scores by program track. Each dot is one student,
    and black diamonds mark the group means. The vertical spread is similar across
    the three tracks, which supports the equal variances assumption.
  alt: Jitter plot of writing scores for the general, academic, and vocational tracks.
    Each dot is a student, and black diamonds mark the group means. The academic track
    sits higher, but the vertical spread of dots is similar across all three columns.
  width_in: 6.5
  height_in: 4.25
  dpi: 300.0
  script: r_code/figures/chapter_06.R
  colour_audit:
    n_colours: 4
    min_contrast: 3.4211399
    min_lab_distance: 55.3717028
- id: '6.4'
  file: fig_06_04_box_writing_boxplot_by_program.png
  type: box
  caption: Side-by-side boxplots of standardized writing scores by program track.
    The line inside each box is the median, the box is the interquartile range, and
    the whiskers extend to the non-outlying data. The academic track has the highest
    median and the narrowest box, with one low outlier.
  alt: Side-by-side boxplots of writing scores for the general, academic, and vocational
    tracks. The academic box sits higher and is shorter than the other two, and a
    single low outlier appears below its lower whisker. The general and vocational
    boxes overlap.
  width_in: 6.5
  height_in: 4.25
  dpi: 300.0
  script: r_code/figures/chapter_06.R
  author_note: The academic track's low outlier is the 31-point writing score.
  colour_audit:
    n_colours: 4
    min_contrast: 3.4211399
    min_lab_distance: 55.3717028
- id: '6.5'
  file: fig_06_05_hist_residuals_histogram_analysis.png
  type: hist
  caption: Distribution of the pooled residuals from the one-way ANOVA in the guided
    analysis. The shape is mostly bell-shaped with a mild left tail, consistent with
    the lowest writing score in the academic track. The smooth curve marks a normal
    distribution with the same mean and standard deviation.
  alt: Histogram of the pooled ANOVA residuals, mostly bell-shaped and centered near
    zero, with a mild left tail. A smooth normal curve is overlaid, and a dashed vertical
    line marks zero.
  width_in: 6.5
  height_in: 4.25
  dpi: 300.0
  script: r_code/figures/chapter_06.R
  author_note: The mild left tail comes from the 31-point writing score in the academic
    track. The rest of the distribution is close to normal.
  colour_audit:
    n_colours: 3
    min_contrast: 2.3074822
    min_lab_distance: 70.8574031
- id: '6.6'
  file: fig_06_06_scatter_residuals_qq_analysis.png
  type: scatter
  caption: Normal Q-Q plot of the pooled ANOVA residuals. Points close to the dashed
    line are consistent with a normal distribution. The points follow the line closely,
    with a small dip in the lower tail from the lowest writing score.
  alt: Normal Q-Q plot of the pooled residuals. Most points hug the dashed diagonal
    reference line, with a small dip below the line at the lower end. There is no
    sharp hook or S-curve.
  width_in: 6.5
  height_in: 4.25
  dpi: 300.0
  script: r_code/figures/chapter_06.R
  author_note: The lower-tail dip reflects the 31-point writing score; the rest of
    the points follow the line.
  colour_audit:
    n_colours: 2
    min_contrast: 5.1854463
    min_lab_distance: 55.3717028
- id: '6.7'
  file: fig_06_07_scatter_writing_jitter_analysis.png
  type: scatter
  caption: Jitter plot of writing scores for the three program tracks in the guided
    analysis. The academic track sits higher, but the full vertical spread of scores
    is similar across groups. Black diamonds mark the group means.
  alt: Jitter plot of writing scores for the three program tracks. The academic column
    sits higher overall, but the total vertical spread of the dots is similar across
    all three columns. Black diamonds mark the group means.
  width_in: 6.5
  height_in: 4.25
  dpi: 300.0
  script: r_code/figures/chapter_06.R
  author_note: The largest group SD is 9.40 (general) and the smallest is 7.94 (academic),
    so the 2X rule is satisfied.
  colour_audit:
    n_colours: 4
    min_contrast: 3.4211399
    min_lab_distance: 55.3717028
