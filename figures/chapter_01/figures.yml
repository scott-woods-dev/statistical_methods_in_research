figures:
- id: '1.2'
  file: fig_01_02_bar_depression_status.png
  type: bar
  caption: Depression screening status among 253 students, ordered from normal to
    severe.
  alt: Bar chart of depression screening status for 253 students. The Normal bar is
    tallest at 209 students, Moderate is 34, and Severe is 10. Bars are ordered Normal,
    Moderate, Severe.
  width_in: 6.5
