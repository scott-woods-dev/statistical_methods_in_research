- id: '1.3'
  file: fig_01_03_bar_pareto_tutoring.png
  type: bar
  caption: An illustrative Pareto chart of reasons for visiting a tutoring and STEM
    resource center.
  alt: Pareto chart of illustrative tutoring and STEM center visits, sorted from most
    to least common. Math Help has the most visits, followed by Computer Use, Statistics
    Help, Writing Help, and Other, which combines the least common reasons.
  width_in: 6.5
  height_in: 4.25
  dpi: 300.0
  script: r_code/figures/chapter_01.R
  author_note: The tutoring counts are illustrative; no dataset exists for this example.
    Other combines the rare reasons so the chart stays readable. Replace with real
    data if the example becomes real.
  colour_audit:
    n_colours: 2
    min_contrast: 5.1854463
    min_lab_distance: 55.3717028
- id: '1.4'
  file: fig_01_04_hist_weekday_sleep.png
  type: hist
  caption: Distribution of weekday sleep hours for 253 students, binned in one-hour
    intervals.
  alt: Histogram of weekday sleep hours in one-hour bins. The distribution is centered
    near 8 hours, with the tallest bins at 7 to 8 and 8 to 9 hours, and few students
    below 5 or above 10 hours.
  width_in: 6.5
  height_in: 4.25
  dpi: 300.0
  script: r_code/figures/chapter_01.R
  colour_audit:
    n_colours: 2
    min_contrast: 2.3074822
    min_lab_distance: 70.8574031
- id: '1.5'
  file: fig_01_05_hist_sleep_normal_overlay.png
  type: hist
  caption: Weekday sleep hours with a fitted normal curve. The histogram is roughly
    symmetric and centered near 8 hours.
  alt: Histogram of weekday sleep hours with a smooth bell-shaped normal curve overlaid.
    The histogram is roughly symmetric, peaks at 7 to 9 hours, and the curve follows
    the same shape.
  width_in: 6.5
  height_in: 4.25
  dpi: 300.0
  script: r_code/figures/chapter_01.R
  colour_audit:
    n_colours: 3
    min_contrast: 2.3074822
    min_lab_distance: 70.8574031
- id: '1.6'
  file: fig_01_06_hist_classes_missed.png
  type: hist
  caption: Distribution of classes missed, showing a strong right skew and a floor
    at zero.
  alt: Right-skewed histogram of classes missed. The tallest bars are at 0 and 1 classes
    missed, with 94 and 49 students, and a long thin tail extends to the right toward
    20.
  width_in: 6.5
  height_in: 4.25
  dpi: 300.0
  script: r_code/figures/chapter_01.R
  colour_audit:
    n_colours: 2
    min_contrast: 2.3074822
    min_lab_distance: 70.8574031
- id: '1.7'
  file: fig_01_07_scatter_classes_missed_gpa.png
  type: scatter
  caption: Classes missed and GPA for 253 students. The downward trend is visible
    but weak.
  alt: Scatterplot of classes missed versus GPA. The points form a loose downward
    cloud, but the relationship is weak; students who missed no classes still range
    from about 2.4 to 4.0 on GPA.
  width_in: 6.5
  height_in: 4.25
  dpi: 300.0
  script: r_code/figures/chapter_01.R
  author_note: The correlation is r = -0.18, so the visual trend is weak. The section
    claims a downward relationship; without a summary line, a skeptical reader may
    not see it.
  colour_audit:
    n_colours: 1
    min_contrast: 5.1854463
    min_lab_distance: .na.real
- id: '1.8'
  file: fig_01_08_segmented_alcohol_by_stress.png
  type: segmented
  caption: Alcohol use within each stress group. Each bar is scaled to 100%, so the
    actual group sizes are hidden.
  alt: Segmented bar chart of alcohol use within stress groups. In the High stress
    group, Moderate drinkers are 41%, Light 36%, Abstain 14%, and Heavy 9%. In the
    Normal stress group, Moderate is 49%, Light 32%, Abstain 13%, and Heavy 6%.
  width_in: 6.5
  height_in: 4.25
  dpi: 300.0
  script: r_code/figures/chapter_01.R
  author_note: Heavy drinking is 8.9% under High stress versus 5.6% under Normal stress.
    The difference is real but modest; the prose says the Heavy segment is noticeably
    taller, which may overstate what the chart shows.
  colour_audit:
    n_colours: 5
    min_contrast: 2.2522876
    min_lab_distance: 33.4254239
- id: '1.9'
  file: fig_01_09_mosaic_stress_alcohol.png
  type: mosaic
  caption: Mosaic plot of stress level and alcohol use. Column width shows group size;
    block height shows the share within each group.
  alt: Mosaic plot of stress level and alcohol use. The Normal stress column is much
    wider, showing 197 students versus 56 under High stress. Within each column, Moderate
    drinkers form the largest block; the Heavy block is 6% under Normal stress and
    9% under High stress.
  width_in: 6.5
  height_in: 4.25
  dpi: 300.0
  script: r_code/figures/chapter_01.R
  match: A mosaic plot of Stress and AlcoholUse
  author_note: The High stress column is 22% of the sample, so the Heavy block difference
    is visually small. Check whether the figure makes the relationship look stronger
    than the data support.
  colour_audit:
    n_colours: 5
    min_contrast: 2.2522876
    min_lab_distance: 33.4254239
- id: 1.9b
  file: fig_01_09b_box_gpa_by_depression.png
  type: box
  caption: GPA by depression screening status. The medians do not decline steadily
    with severity.
  alt: Side-by-side box plots of GPA for the Normal, Moderate, and Severe depression
    groups. Median GPA is 3.25 in the Normal group, 3.32 in the Moderate group, and
    3.04 in the Severe group. The Moderate group has the widest middle 50%.
  width_in: 6.5
  height_in: 4.25
  dpi: 300.0
  script: r_code/figures/chapter_01.R
  match: Side-by-side box plots showing GPA
  author_note: 'Medians are 3.25 (Normal), 3.32 (Moderate), 3.04 (Severe): no monotonic
    decline. The figure works for comparing spreads but does not support a simple
    depression-lowers-GPA story.'
  colour_audit:
    n_colours: 2
    min_contrast: 1.2340449
    min_lab_distance: 82.8052266
- id: '1.10'
  file: fig_01_10_scatter_gpa_missed_by_stress.png
  type: scatter
  caption: Classes missed and GPA by stress level. Shape and color both encode stress,
    so the groups remain distinguishable without color.
  alt: Scatterplot of classes missed versus GPA, with Normal stress shown as circles
    and High stress shown as triangles. The Normal group follows a loose downward
    trend, while High stress points are spread across the full range of classes missed
    rather than clustering in one corner.
  width_in: 6.5
  height_in: 4.25
  dpi: 300.0
  script: r_code/figures/chapter_01.R
  author_note: High stress students are spread across the full range of classes missed,
    not clustered in the bottom right. The figure may not deliver the example's intended
    lesson.
  colour_audit:
    n_colours: 2
    min_contrast: 3.8671838
    min_lab_distance: 114.6049825
- id: '1.11'
  file: fig_01_11_bubble_sleep_gpa_drinks.png
  type: bubble
  caption: Weekday sleep, GPA, and weekly drinks. Bubble size encodes drinks per week.
  alt: Bubble plot of weekday sleep versus GPA, with bubble size showing weekly drinks.
    Most bubbles are small, and larger bubbles are scattered across the sleep range
    rather than clustered at low sleep and low GPA.
  width_in: 6.5
  height_in: 4.25
  dpi: 300.0
  script: r_code/figures/chapter_01.R
  author_note: The largest bubbles do not obviously cluster at low sleep and low GPA,
    so the figure may not support the hunt-for-complex-patterns framing.
  colour_audit:
    n_colours: 2
    min_contrast: 5.1854463
    min_lab_distance: 55.3717028
- id: '1.13'
  file: fig_01_13_diagram_iqr_boxplot.png
  type: diagram
  caption: Quartiles and the interquartile range on a box plot.
  alt: Diagram of a box plot. The left edge of the box is labeled Q1, the 25th percentile;
    the center line is the median, the 50th percentile; and the right edge is Q3,
    the 75th percentile. A bracket above the box spans Q1 to Q3 and is labeled IQR
    equals Q3 minus Q1.
  width_in: 6.5
  height_in: 4.25
  dpi: 300.0
  script: r_code/figures/chapter_01.R
  colour_audit:
    n_colours: 2
    min_contrast: 1.2340449
    min_lab_distance: 82.8052266
- id: '1.15'
  file: fig_01_15_box_classes_missed_by_depression.png
  type: box
  caption: Classes missed by depression screening status. The Severe group has the
    highest median, but the step from Normal to Moderate is flat.
  alt: Side-by-side box plots of classes missed for the Normal, Moderate, and Severe
    depression groups. Median classes missed is 1 in the Normal group, 1 in the Moderate
    group, and 2 in the Severe group. Spread is similar in the Normal and Moderate
    groups and narrower in the Severe group.
  width_in: 6.5
  height_in: 4.25
  dpi: 300.0
  script: r_code/figures/chapter_01.R
  author_note: The prose and the table below claim medians 1, 2, 4 and IQRs 2, 3,
    5. The CSV gives medians 1, 1, 2 and IQRs 3, 3, 0.75. The figure follows the CSV,
    so it will contradict the table. The prose needs review before this figure ships.
  colour_audit:
    n_colours: 2
    min_contrast: 1.2340449
    min_lab_distance: 82.8052266
