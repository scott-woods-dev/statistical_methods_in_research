figures:
- id: '1.2'
  file: fig_01_02_bar_depression_status.png
  type: bar
  caption: Depression screening status among 253 students, ordered from normal to
    severe.
  alt: Bar chart of depression screening status for 253 students. The normal bar is
    tallest at 209 students, moderate is 34, and severe is 10. Bars are ordered normal,
    moderate, severe.
  width_in: 6.5
  height_in: 4.25
  dpi: 300.0
  script: r_code/figures/chapter_01.R
  colour_audit:
    n_colours: 2
    min_contrast: 5.1854463
    min_lab_distance: 55.3717028
- id: '1.3'
  file: fig_01_03_bar_pareto_tutoring.png
  type: bar
  caption: An illustrative Pareto chart of reasons for visiting a tutoring and STEM
    resource center.
  alt: Pareto chart of illustrative tutoring and STEM center visits, sorted from most
    to least common. Math Help has the most visits, followed by Computer Use, Statistics
    Help, Writing Help, and Other, which combines the least common reasons.
  width_in: 6.5
  height_in: 4.25
  dpi: 300.0
  script: r_code/figures/chapter_01.R
  author_note: The tutoring counts are illustrative; no dataset exists for this example.
    Other combines the rare reasons so the chart stays readable. Replace with real
    data if the example becomes real.
  colour_audit:
    n_colours: 2
    min_contrast: 5.1854463
    min_lab_distance: 55.3717028
- id: '1.4'
  file: fig_01_04_hist_weekday_sleep.png
  type: hist
  caption: Distribution of weekday sleep hours for 253 students, binned in one-hour
    intervals.
  alt: Histogram of weekday sleep hours in one-hour bins. The distribution is centered
    near 8 hours, with the tallest bins at 7 to 8 and 8 to 9 hours, and few students
    below 5 or above 10 hours.
  width_in: 6.5
  height_in: 4.25
  dpi: 300.0
  script: r_code/figures/chapter_01.R
  colour_audit:
    n_colours: 2
    min_contrast: 2.3074822
    min_lab_distance: 70.8574031
- id: '1.5'
  file: fig_01_05_hist_sleep_normal_overlay.png
  type: hist
  caption: Weekday sleep hours with a fitted normal curve. The histogram is roughly
    symmetric and centered near 8 hours.
  alt: Histogram of weekday sleep hours with a smooth bell-shaped normal curve overlaid.
    The histogram is roughly symmetric, peaks at 7 to 9 hours, and the curve follows
    the same shape.
  width_in: 6.5
  height_in: 4.25
  dpi: 300.0
  script: r_code/figures/chapter_01.R
  colour_audit:
    n_colours: 3
    min_contrast: 2.3074822
    min_lab_distance: 70.8574031
- id: '1.6'
  file: fig_01_06_hist_classes_missed.png
  type: hist
  caption: Distribution of classes missed, showing a strong right skew and a floor
    at zero.
  alt: Right-skewed histogram of classes missed. The tallest bars are at 0 and 1 classes
    missed, with 94 and 49 students, and a long thin tail extends to the right toward
    20.
  width_in: 6.5
  height_in: 4.25
  dpi: 300.0
  script: r_code/figures/chapter_01.R
  colour_audit:
    n_colours: 2
    min_contrast: 2.3074822
    min_lab_distance: 70.8574031
- id: '1.7'
  file: fig_01_07_scatter_gdp_life_expectancy.png
  type: scatter
  caption: GDP per capita and life expectancy for 143 of the 147 countries in the
    Happy Planet Index data. The trend rises steeply at low incomes and then levels
    off.
  alt: Scatterplot of GDP per capita versus life expectancy for 143 countries. Points
    rise steeply from the low 50s at the lowest incomes and then flatten near 80 years
    at higher incomes.
  width_in: 6.5
  height_in: 4.25
  dpi: 300.0
  script: r_code/figures/chapter_01.R
  author_note: Four countries in the CSV (Taiwan, Turkmenistan, Venezuela, Yemen)
    have no GDPperCapita value, so they are omitted. The plot uses n = 143. The overall
    trend is positive, but the form is nonlinear at high incomes.
  colour_audit:
    n_colours: 2
    min_contrast: 5.1854463
    min_lab_distance: 55.3717028
- id: '1.8'
  file: fig_01_08_segmented_alcohol_by_stress.png
  type: segmented
  caption: Alcohol use within each stress group. Each bar is scaled to 100%, so the
    actual group sizes are hidden.
  alt: Segmented bar chart of alcohol use within stress groups. In the High stress
    group, Moderate drinkers are 41%, Light 36%, Abstain 14%, and Heavy 9%. In the
    Normal stress group, Moderate is 49%, Light 32%, Abstain 13%, and Heavy 6%.
  width_in: 6.5
  height_in: 4.25
  dpi: 300.0
  script: r_code/figures/chapter_01.R
  colour_audit:
    n_colours: 5
    min_contrast: 2.2522876
    min_lab_distance: 33.4254239
- id: '1.9'
  file: fig_01_09_mosaic_stress_alcohol.png
  type: mosaic
  caption: Mosaic plot of stress level and alcohol use. Column width shows group size;
    block height shows the share within each group.
  alt: Mosaic plot of stress level and alcohol use. The Normal stress column is much
    wider, showing 197 students versus 56 under High stress. Within each column, Moderate
    drinkers form the largest block; the Heavy block is 6% under Normal stress and
    9% under High stress.
  width_in: 6.5
  height_in: 4.25
  dpi: 300.0
  script: r_code/figures/chapter_01.R
  match: A mosaic plot of Stress and AlcoholUse
  colour_audit:
    n_colours: 5
    min_contrast: 2.2522876
    min_lab_distance: 33.4254239
- id: 1.9b
  file: fig_01_09b_box_gpa_by_depression.png
  type: box
  caption: GPA by depression screening status for 253 students. The severe group has
    the lowest median and third quartile.
  alt: Side-by-side box plots of GPA for the normal, moderate, and severe depression
    groups. Median GPA is 3.25 in the normal group, 3.33 in the moderate group, and
    3.04 in the severe group. The third quartile is 3.50, 3.60, and 3.35. The moderate
    group has the widest middle 50%.
  width_in: 6.5
  height_in: 4.25
  dpi: 300.0
  script: r_code/figures/chapter_01.R
  match: Side-by-side box plots showing GPA
  colour_audit:
    n_colours: 2
    min_contrast: 1.2340449
    min_lab_distance: 82.8052266
- id: '1.10'
  file: fig_01_10_scatter_gdp_lifeexp_by_region.png
  type: scatter
  caption: GDP per capita and life expectancy for 143 countries, grouped by region.
    Sub-Saharan Africa clusters at low values of both, and Western Europe at high
    values of both.
  alt: Scatterplot of GDP per capita versus life expectancy for 143 countries. Sub-Saharan
    Africa is shown as triangles at low GDP per capita and low life expectancy, Western
    Europe as circles at high values of both, and other regions as squares in between.
  width_in: 6.5
  height_in: 4.25
  dpi: 300.0
  script: r_code/figures/chapter_01.R
  colour_audit:
    n_colours: 3
    min_contrast: 3.4211399
    min_lab_distance: 70.1211558
- id: '1.11'
  file: fig_01_11_bubble_gdp_lifeexp_footprint.png
  type: bubble
  caption: GDP per capita, life expectancy, and ecological footprint for 143 countries.
    Bubble size encodes the ecological footprint.
  alt: Bubble plot of GDP per capita versus life expectancy for 143 countries. Bubble
    size shows the ecological footprint. Most bubbles are small and cluster at low
    GDP per capita. The largest bubbles, including Qatar and Luxembourg, sit at higher
    GDP per capita.
  width_in: 6.5
  height_in: 4.25
  dpi: 300.0
  script: r_code/figures/chapter_01.R
  colour_audit:
    n_colours: 2
    min_contrast: 5.1854463
    min_lab_distance: 55.3717028
- id: '1.12'
  file: fig_01_12_diagram_iqr_boxplot.png
  type: diagram
  caption: Quartiles and the interquartile range on a box plot.
  alt: Diagram of a box plot. The left edge of the box is labeled Q1, the 25th percentile;
    the center line is the median, the 50th percentile; and the right edge is Q3,
    the 75th percentile. A bracket above the box spans Q1 to Q3 and is labeled IQR
    equals Q3 minus Q1.
  width_in: 6.5
  height_in: 4.25
  dpi: 300.0
  script: r_code/figures/chapter_01.R
  colour_audit:
    n_colours: 2
    min_contrast: 1.2340449
    min_lab_distance: 82.8052266
- id: '1.13'
  file: fig_01_13_box_classes_missed_by_anxiety.png
  type: box
  caption: Classes missed by anxiety screening status for 253 students. The severe
    group has a higher median and a wider middle 50%.
  alt: Side-by-side box plots of classes missed for the normal, moderate, and severe
    anxiety groups. Median classes missed is 1 in the normal group, 1 in the moderate
    group, and 4.5 in the severe group. The severe group also has the widest middle
    50%, from 1.5 to 6.25.
  width_in: 6.5
  height_in: 4.25
  dpi: 300.0
  script: r_code/figures/chapter_01.R
  author_note: The severe anxiety group has 16 students, so its box describes a small
    sample. The figure compares the groups in this sample; it is not a population
    estimate.
  colour_audit:
    n_colours: 2
    min_contrast: 1.2340449
    min_lab_distance: 82.8052266
