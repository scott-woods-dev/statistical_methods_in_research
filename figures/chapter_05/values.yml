chapter: 5
source: r_code/figures/chapter_05_values.R
script: r_code/figures/chapter_05_values.R
conventions:
  note: Ordinary least squares. The births models treat habit as a smoker indicator
    with nonsmoker as the reference, and mature as a mature-mom indicator with younger
    mom as the reference. In the salary models, Sex is 1 = male and 0 = female, and
    PhD is 1 = holds a PhD and 0 = does not. No Type III sums of squares or contrast
    choices apply to these models.
values:
  data:
    births_file: births_2014.csv
    births_rows: 1000
    births_missing_visits: 56
    births_missing_habit: 19
    salary_file: college_teacher_salary_2023.csv
    salary_rows: 200
