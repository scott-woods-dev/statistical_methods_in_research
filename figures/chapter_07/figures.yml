    blood pressure on the y-axis. The Under 40 line falls from control to informed,
    the 40+ line rises, and a single NA point appears near the informed position.
    The 40+ line stays above the Under 40 line.
  width_in: 6.5
  height_in: 4.25
  dpi: 300.0
  script: r_code/figures/chapter_07.R
  author_note: The 9 maids with missing Syst2 are excluded from the means. The NA
    point is the 1 maid with missing Age (Syst2 = 116), not the 9 missing blood pressure
    cases.
