chapter: 11
source: r_code/figures/chapter_11_values.R
script: r_code/figures/chapter_11_values.R
conventions:
  extraction: The chapter's factor analysis is principal axis factoring with varimax
    rotation, reproduced with psych::fa(fm = 'pa', rotate = 'varimax'). The Maximum
    Likelihood comparison uses fm = 'ml'. The PCA comparison uses psych::principal(rotate
    = 'varimax'). All solutions request two factors.
  sample: 'Analyses use listwise-complete cases: female n = 238 and male n = 236 of
    the file''s 276 pairs. Ratings are integers from 1 to 10.'
  variance: The Proportion of Variance row divides each factor's SS loading by the
    six items, so it is a share of total variance. Factor 1 is 27.0% and Factor 2
    is 26.1%, for 53.1% of total variance. The two-factor solution accounts for all
    of the common variance it extracts.
  alpha: Cronbach's alpha uses psych::alpha with check.keys = FALSE because all six
    items are positively worded. Item-total statistics are not reported in the chapter.
  scree: The scree values are the initial eigenvalues of the correlation matrix, the
    values SPSS plots. The elbow rule and the eigenvalue > 1 rule both point to two
    factors. Parallel analysis is not part of the chapter's method and is not used.
  male_solution: The male two-factor PAF solution reports 'maximum iteration exceeded'
    in psych. The chapter's Halo Effect argument does not depend on those loadings,
    and the exercises ask students to inspect them rather than to match a printed
    value.
  software_differences: Values are rounded to three decimals as in the chapter. SPSS
    may print the last digit differently because of its iteration and rotation tolerances;
    the chapter labels the tables as emulated SPSS output.
