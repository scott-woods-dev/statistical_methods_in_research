chapter: 4
source: r_code/figures/chapter_04.R
script: r_code/figures/chapter_04.R
conventions:
  note: Ordinary least squares. The life-expectancy model uses a base-10 logarithm
    of GDPperCapita. The complete-case sample is 143 countries; 4 countries in the
    CSV have no GDPperCapita.
values:
  data:
    file: happy_planet_index_2024.csv
    total_countries: 147
    complete_cases: 143
    missing_gdp: 4
  figure_4_1:
    note: Illustrative exponential curves; no dataset is used.
  figure_4_2:
    note: Scatterplot of GDP per capita and life expectancy; n = 143 complete cases.
  figure_4_3:
    note: Regression of Footprint on GDPperCapita with confidence and prediction intervals;
      n = 143.
  footprint_model:
    model: lm(Footprint ~ GDPperCapita, data = hp_complete)
    'n': 143
    r_squared: 0.6512018
    adjusted_r_squared: 0.648728
    f: 263.2451493
    df1: 1.0
    df2: 141.0
    p: 4.6728145e-34
    coefficients:
    - term: (Intercept)
      estimate: 1.6719584
      se: 0.4935776
      t: 3.3874278
      p: 0.0009146
    - term: GDPperCapita
      estimate: 0.0002468
      se: 1.5212077e-05
      t: 16.2248313
      p: 4.6728145e-34
    r: 0.8069707
    slope_ci:
    - lower_95: 0.6961893
      upper_95: 2.6477274
      term: (Intercept)
    - lower_95: 0.0002167
      upper_95: 0.0002769
      term: GDPperCapita
    prediction_at_70000:
