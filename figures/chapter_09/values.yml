  figures:
    figure_9_1:
      note: 'Linear fit Survive ~ Pulse: intercept 0.84696, slope -0.0004747. Predicted
        survival runs from 0.828 at Pulse 39 to 0.756 at Pulse 192. The line reaches
        0 only at Pulse 1,784.'
    figure_9_2:
      note: 'Conceptual diagram: probability, odds = pi/(1-pi), and logit = log(pi/(1-pi))
        plotted against the same probability axis.'
    figure_9_3:
      note: ROC computed from the full model's fitted probabilities without a package.
        The triangle is the 50% classification threshold from the confusion matrix
        (sensitivity 0.994, false positive rate 0.95).
  table_9_1:
    note: Simple logistic regression of survival on Age; coefficients are in simple_model_age.
  table_9_2:
    note: Predicted probability for a 65-year-old from the simple Age model; values
      are in prediction_age65_simple.
  table_9_3:
    note: Multiple logistic regression coefficients, standard errors, Wald 95% CIs,
      z, p, and VIF are in multiple_model.
  table_9_4:
    note: Odds ratios and 95% CIs are the odds_ratio, or_ci_low, and or_ci_high columns
      in multiple_model$coefficients.
  table_9_5:
    note: 65-year-old elective admission; first row of prediction_profiles_age65.
  table_9_6:
    note: 65-year-old emergency admission; second row of prediction_profiles_age65.
  table_9_7:
    note: Confusion matrix at the 50% threshold; values are in classification_threshold_50.
