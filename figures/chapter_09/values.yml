    se_response: 0.0416985
    ci_low: 0.611942
    ci_high: 0.7743205
  classification_threshold_50:
    threshold: 0.5
    rule: Predicted survival when fitted probability > 0.50
    table:
    - predicted: '0'
      actual: '0'
      count: 2
    - predicted: '1'
      actual: '0'
      count: 38
    - predicted: '0'
      actual: '1'
      count: 1
    - predicted: '1'
      actual: '1'
      count: 159
    true_positive: 159
    false_negative: 1
    true_negative: 2
    false_positive: 38
    sensitivity: 0.99375
    specificity: 0.05
    accuracy: 0.805
  roc_auc:
    auc: 0.7491406
