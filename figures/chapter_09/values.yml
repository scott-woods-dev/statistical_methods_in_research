chapter: 9
source: r_code/chapter_09.r
script: r_code/figures/chapter_09.R
conventions:
  outcome: Survive = 1 means survived to discharge; Survive = 0 means died in the
    hospital.
  models: The simple model in Table 9.1 is glm(Survive ~ Age); the multiple model
    is glm(Survive ~ Emergency + Age); both use the binomial family with the logit
    link.
  confidence_intervals: Coefficient CIs are Wald intervals (estimate +/- 1.96 SE).
    Predicted probability CIs are Wald intervals on the logit scale, back-transformed
    with plogis; this reproduces the chapter's (0.713830, 0.835130).
  vif: VIF from car::vif(full_model), R's standard GLM method, which uses the covariance
    matrix of the coefficient estimates. Both predictors give 1.010. The auxiliary-regression
    VIF used for lm models gives 1.036. Minitab reports the same 1.01 for this model;
    other software can differ slightly.
  deviance: 'Deviance R-squared = 1 - residual deviance/null deviance. Adjusted deviance
    R-squared uses the same adjustment as summary(lm) $adj.r.squared: 1 - (1 - R-squared)(n
    - 1)/(n - p) with p = 3, the intercept plus the two predictors. The result is
    0.1265. The goodness-of-fit p-value is pchisq(residual deviance, residual df,
    lower.tail = FALSE).'
  software_differences: 'Minitab''s adjusted deviance R-squared uses a different penalty
    and reports 12.53% for this model; its VIF is 1.01, matching car::vif. The chapter
    uses the R values: VIF 1.01 and adjusted deviance R-squared 12.65%.'
  classification: At the 50% threshold a patient is classified as predicted survival
    when the fitted probability is greater than 0.50.
  roc: The ROC curve sweeps every unique fitted probability. The AUC is the Mann-Whitney
    statistic, equivalent to the area under the step curve.
  prose_checks: 'Reproduced from the CSV: Age coefficient -0.0275 and OR 0.973; full
    model Age OR 0.9666 and Emergency OR 0.0860; VIF 1.01 from car::vif; 65-year-old
    fitted 0.780442 with CI (0.713830, 0.835130); 65-year-old elective 0.964350 and
    emergency 0.699344; confusion matrix 159/38/2/1; sensitivity 99.4%; specificity
    5.0%; AUC 0.7491; deviance R-squared 13.53%; goodness-of-fit chi-square 173.08
    on 197 df, p = 0.890. The text uses VIF 1.01 and adjusted deviance R-squared 12.65%,
    R''s values with p = all parameters. Minitab reports 12.53% for the adjusted value.'
  reference_script: r_code/chapter_09.r fits Survive ~ Pulse as its baseline model
    and does not fit Survive ~ Age, so it does not reproduce Table 9.1 or the 65-year-old
    prediction. This script fits the Age model the prose uses.
values:
  data:
    icu_rows: 200
    survived: 160
    died: 40
  simple_model_age:
    model: glm(Survive ~ Age, family = binomial)
    'n': 200
    coefficients:
    - term: (Intercept)
      estimate: 3.0585132
      se: 0.6960812
      z: 4.3939027
      p: 1.1133365e-05
      ci_low: 1.6942191
      ci_high: 4.4228074
      odds_ratio: 21.2958716
      or_ci_low: 5.4423942
      or_ci_high: 83.3298966
    - term: Age
      estimate: -0.0275426
      se: 0.0105642
      z: -2.6071737
      p: 0.0091293
      ci_low: -0.048248
      ci_high: -0.0068372
      odds_ratio: 0.9728332
      or_ci_low: 0.9528974
      or_ci_high: 0.9931861
    null_deviance: 200.1609694
    residual_deviance: 192.3063804
    deviance_r2: 0.0392414
  prediction_age65_simple:
