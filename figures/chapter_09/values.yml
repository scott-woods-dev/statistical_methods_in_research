      se: 0.7525698
      z: -3.2602094
      p: 0.0011133
      ci_low: -3.9285449
      ci_high: -0.9785254
      odds_ratio: 0.0859891
      or_ci_low: 0.0196723
      or_ci_high: 0.3758649
    - term: Age
