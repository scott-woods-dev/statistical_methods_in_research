chapter: 8
source: r_code/chapter_08.r
script: r_code/figures/chapter_08.R
conventions:
  chi_square: Pearson chi-square tests. The goodness-of-fit expected counts use the
    2020 Census weights c(5.9, 12.1, 18.7, 0.7, 57.8)%, rescaled to sum to 1 after
    excluding the 4.8% other/multiracial category.
  mcnemar: mcnemar.test with continuity correction (R default).
  cramers_v: 'Cramer''s V = sqrt(chi-square/(N*(min(r,c)-1))). The example collapses
    the raw armed field to Gun, Unarmed, and Other weapon: Gun is armed == ''gun'',
    Unarmed is armed == ''unarmed'', and every other retained entry is Other weapon.
    Cases coded missing, ''undetermined'', or ''unknown weapon'' are excluded. The
    resulting 3 x 3 table has N = 5963 and df = 4.'
  risk: RR = risk of survival with infection / risk of survival without infection;
    OR from the same 2 x 2 table.
  classification: The pulse rule predicts emergency when Pulse > 100; rows are predicted
    and columns are actual.
  software: r_code/chapter_08.r calls DescTools::CramerV() and epitools for the risk
    measures. Those packages are not installed here, so this script reproduces the
    same quantities with base R table(), chisq.test(), and mcnemar.test().
  note: The chapter's Cramer's V example was replaced with a 3 x 3 grouping that meets
    the expected-count assumption. The earlier 99 x 3 table had 247 of 297 expected
    counts below 5.
