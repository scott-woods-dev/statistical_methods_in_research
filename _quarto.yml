project:
  type: book
  output-dir: docs
  resources:
    - data/*.csv
  post-render: tools/datasets/build_archive.sh

filters:
  - filters/glossary.lua

book:
  title: "Statistical Methods in Research"
  subtitle: "A Conceptual Approach"
  author: "Scott Woods"
  date: today
  # Search is a box in the sidebar, as in the companion, not an icon in the navbar.
  search:
    type: textbox
  sidebar:
    search: true
  navbar:
    search: false
    right:
      - text: "R Companion"
        href: companion/index.html
  chapters:
    - index.md
    - chapters/preface.md
    - part: "Unit I: Foundations of Data Analysis"
      chapters:
        - chapters/chapter-01.md
        - chapters/chapter-02.md
        - chapters/chapter-03.md
    - part: "Unit II: Linear Regression and Transformations"
      chapters:
        - chapters/chapter-04.md
        - chapters/chapter-05.md
    - part: "Unit III: Design of Experiments (ANOVA)"
      chapters:
        - chapters/chapter-06.md
        - chapters/chapter-07.md
    - part: "Unit IV: Categorical Data Analysis"
      chapters:
        - chapters/chapter-08.md
        - chapters/chapter-09.md
    - part: "Unit V: Advanced Tools and Ethical Considerations"
      chapters:
        - chapters/chapter-10.md
        - chapters/chapter-11.md
        - chapters/chapter-12.md
        - chapters/chapter-13.md
  appendices:
    - chapters/appendix-glossary.md
    - chapters/appendix-datasets.md
    - chapters/appendix-index.md

format:
  html:
    theme:
      - cosmo
      - custom.scss
    toc: true
    toc-location: left
    number-sections: true
    df-print: paged
    include-after-body:
      - includes/glossary.html
      - includes/a11y.html
  pdf:
    documentclass: book
    mainfont: Times New Roman
    toc: true
    number-sections: true
    include-in-header:
      text: |
        \usepackage{caption}
        \usepackage{graphicx}
        \usepackage{eso-pic}
        \captionsetup[figure]{labelformat=empty}
        \captionsetup[table]{labelformat=empty}
        % Running headers. The book class prints them in capitals on one line,
        % so long titles ran into the page number. Print them in normal
        % capitalization instead (\MakeUppercase is switched off while each
        % mark is stored), and scale any title still too wide for the line,
        % minus room for the page number, down to fit.
        \makeatletter
        \let\sm@markboth\markboth
        \let\sm@markright\markright
        \renewcommand\markboth[2]{\begingroup\let\MakeUppercase\@firstofone
          \sm@markboth{#1}{#2}\endgroup}
        \renewcommand\markright[1]{\begingroup\let\MakeUppercase\@firstofone
          \sm@markright{#1}\endgroup}
        \let\@mkboth\markboth
        \newlength\sm@hdrmax
        \newsavebox\sm@hdrbox
        \newcommand\sm@fithdr[1]{%
          \setlength\sm@hdrmax{\textwidth}\addtolength\sm@hdrmax{-2.5em}%
          \sbox\sm@hdrbox{\slshape #1}%
          \ifdim\wd\sm@hdrbox>\sm@hdrmax
            \resizebox{\sm@hdrmax}{!}{\usebox\sm@hdrbox}%
          \else\usebox\sm@hdrbox\fi}
        \def\@evenhead{\thepage\hfil\sm@fithdr{\leftmark}}
        \def\@oddhead{\sm@fithdr{\rightmark}\hfil\thepage}
        \g@addto@macro\ps@headings{%
          \def\@evenhead{\thepage\hfil\sm@fithdr{\leftmark}}%
          \def\@oddhead{\sm@fithdr{\rightmark}\hfil\thepage}}
        \makeatother
        % Cover title page. The stock title page is replaced by a blank page,
        % and the cover PDF is painted full bleed behind it. The starred
        % \AddToShipoutPictureBG applies to the current page only.
        % Regenerate the artwork with Rscript r_code/figures/cover.R
        \renewcommand{\maketitle}{%
          \begin{titlepage}
            \thispagestyle{empty}%
            \null
            \AddToShipoutPictureBG*{%
              \includegraphics[width=\paperwidth,height=\paperheight]{images/cover_title_page.pdf}%
            }%
          \end{titlepage}%
        }
